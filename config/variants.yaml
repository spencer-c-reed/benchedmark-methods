      role: role@v2
      league: league@v2
      obs: obs@disclosed
      time: time@agent
      conduct: conduct@v2
      ctx: ctx@notebook
      out: out@json-v2
      forecast: forecast@v2
  v2.ref+private:
    note: 'v2.ref in a private-information league (G3/G4: owner-first reports, embargo)'
    blocks:
      role: role@v2
      league: league@v2.private
      obs: obs@silent
      time: time@agent
      conduct: conduct@v2
      ctx: ctx@notebook
      out: out@json-v2
      forecast: forecast@v2
  v2.ref+private+disclosed:
    note: v2.ref+private with the disclosed clause
    blocks:
      role: role@v2
      league: league@v2.private
      obs: obs@disclosed
      time: time@agent
      conduct: conduct@v2
      ctx: ctx@notebook
      out: out@json-v2
      forecast: forecast@v2
