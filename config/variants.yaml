variants:
  v2.ref:
    note: 'Full-game reference: open-field league, agent wakes, notebook context,
      JSON tool route; observation clause per seat'
    blocks:
      role: role@v2
      league: league@v2
      obs: obs@silent
      time: time@agent
      conduct: conduct@v2
      ctx: ctx@notebook
      out: out@json-v2
      forecast: forecast@v2
  v2.ref+disclosed:
